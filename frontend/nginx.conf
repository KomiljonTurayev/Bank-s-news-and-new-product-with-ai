# Bank's News frontend — statik (vite build dist/) + /api proksi.
# /api so'rovlari nginx orqali backend'ga o'tkaziladi:
# brauzer barcha so'rovlarni bitta origin'dan oladi, CORS muammosi
# butunlay yo'qoladi.
#
# envsubst: fayl /etc/nginx/templates/default.conf.template'ga qo'yiladi va
# entrypoint.sh uni ishga tushishda renderlaydi — faqat ${API_UPSTREAM} va
# ${RESOLVER}; $host/$uri kabi nginx o'zgaruvchilariga tegilmaydi.
#
# TASHXIS IZI. Proksi 502 berganda sabab tashqaridan ko'rinmaydi — shu uchun
# har bir so'rovga $request_id yoziladi (javobdagi X-Request-ID sarlavhasi va
# log qatoridagi rid=). Pod logidan rid bo'yicha qidirilsa:
#   upstream="-"                     manzil DNS'da yo'q -> API_UPSTREAM xato
#   upstream="10.0.0.5:8000" 502     manzil to'g'ri, backend javob bermayapti

log_format proxied '$remote_addr [$time_local] "$request" $status rt=$request_time '
                   'upstream="$upstream_addr" ustatus=$upstream_status rid=$request_id';

server {
    listen ${PORT};
    server_name _;

    # server darajasida aytilgani uchun http'dagi oddiy access_log'ni shu
    # server bo'yicha BITTASI almashtiradi — log ikkilanmaydi.
    access_log /var/log/nginx/access.log proxied;
    add_header X-Request-ID $request_id always;
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass'da o'zgaruvchi ishlatilgani uchun host nomi ishga
    # tushishda emas, har so'rovda hal qilinadi (quyida) — shu bois
    # resolver kerak. Manzil entrypoint.sh'da /etc/resolv.conf'dan
    # o'qib olinadi (k8s'da bu klaster DNS'i — kube-dns/coredns).
    resolver ${RESOLVER} valid=10s;
    # DNS javob bermasa ham so'rov osib qolmasin: 502 bir necha sekundda.
    resolver_timeout 3s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Vite nomlangan hash'li fayllar chiqaradi (index-a1b2c3.js) —
    # kontent o'zgarsa nom ham o'zgaradi, shu bois bir yillik immutable
    # kesh xavfsiz.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Request-ID $request_id always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmasin — yangi build'dagi hash'li
    # asset nomlari shu fayldan o'qiladi.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Request-ID $request_id always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # /api/... -> backend (API_UPSTREAM env orqali sozlanadi, default imagen
    # http://backend:8000; Railway'da http://<backend>.railway.internal:8000).
    # — k8s Service FQDN'i).
    # $upstream'ga yozib keyin proxy_pass qilinadi (literal emas) —
    # aks holda host hali DNS'da yo'q bo'lsa, nginx ISHGA TUSHISHDA
    # "host not found in upstream" bilan butunlay crash bo'ladi
    # (CrashLoopBackOff). O'zgaruvchi bilan bunday host faqat shu
    # so'rovga 502 qaytaradi, konteyner tirik qoladi.
    location /api/ {
        set $upstream ${API_UPSTREAM};
        proxy_pass $upstream;
        # HTTP/1.1 + bo'sh Connection: aks holda nginx backend'ga har
        # so'rovni HTTP/1.0 + Connection: close bilan yuboradi.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Repoda yuklovchi endpoint yo'q, eng katta body ~2 KB (mahsulot);
        # 1 MB — hozirgi default, ataylab yozib qo'yildi: kelajakda
        # bulk-POST kelsa, limit jimjit o'zgarmasin (413 HTML bo'ladi).
        client_max_body_size 1m;
        # Ulanish timeouti default 60s: "yutib qo'yuvchi" upstream'da
        # mijoz 60s osilmasligi uchun 3s.
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        # proxy_intercept_errors off (default): bu qator faqat nginx'ning
        # O'ZI hosil qilgan xatolarga tegishli — backend/qovushayotgan
        # serverning haqiqiy 502/503 javoblari shakl o'zgarmaydi o'tadi.
        # 502 = ulanib bo'lmadi, 504 = ulandi-u, javob ulgurmedi —
        # mijozda ham ajralib ko'rinsin.
        error_page 502 = @api_down;
        error_page 504 = @api_timeout;
    }

    # Backend manzilga ulanib bo'lmaganda ham javob foydalanuvchi
    # tushunadigan va logda topiladigan bo'lsin. Ichki host/IP ataylab
    # ko'rsatilmaydi — u faqat pod logida (rid bo'yicha).
    location @api_down {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"api_upstream_unreachable","request_id":"$request_id"}';
    }

    # Backend tirik, lekin javob byudjetdan (proxy_read_timeout 60s) chiqdi —
    # "yetib bo'lmadi" "ulanib bo'lmadi"dan ajraladi (mas. sekinlagan DWH).
    location @api_timeout {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        return 504 '{"error":"api_timeout","request_id":"$request_id"}';
    }


    # SPA fallback: /login, /offers kabi yo'llar fayl emas — index.html
    # router'ni o'zi boshqaradi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
