# Xavfsizlik sarlavhalari — nginx.conf'da server darajasida VA o'z
# add_header'i bor har bir location'da include qilinadi: nginx'da location
# ichidagi add_header server darajasidagilarni bekor qiladi (meros olmaydi).
#
# CSP: script-src'dagi sha256 — index.html'dagi inline tema skriptining
# xeshi. U Docker build'da tayyor dist/index.html'dan hisoblanadi
# (scripts/csp-hash.mjs) — skript o'zgarsa ham qo'lda yangilash shart emas.
# style-src 'unsafe-inline' — Mantine/emotion uslublarni runtime'da qo'shadi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' '__INLINE_SCRIPT_HASHES__'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
